set -g default-shell $SHELL
set -g default-command $SHELL

# Use vim keybindings in copy mode
setw -g mode-keys vi

bind-key -r C-k resize-pane -U
bind-key -r C-j resize-pane -D
bind-key -r C-h resize-pane -L
bind-key -r C-l resize-pane -R

# Vim style pane selection
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

bind-key X confirm-before -p "kill-session #S? (y/n)" kill-session
# Multi-arg form so tmux execs /bin/sh directly instead of going through
# the default shell (fish), which adds ~350ms of config loading overhead.
bind-key f display-popup -EE -w 90% -h 70% -T " 󰛡 Hive " /bin/sh -c /Users/ameykusurkar/projects/ameykusurkar/hive/target/release/hive


# Status bar
set -g status-left-length 40
set -g status-left ' #S #[fg=#6c7086]│ '
set -g status-right-length 60
set -g status-right '#[bg=#313244] #(~/projects/ameykusurkar/dotfiles/scripts/tmux-battery) #[bg=#45475a] %a %b %d #[bg=#585b70] %l:%M%p '
set -g window-status-current-format '#[fg=#89b4fa,bold]#W'
set -g window-status-format '#[fg=#6c7086]#W'
set -g window-status-separator '  '

set -g status-style 'bg=#181825,fg=#cdd6f4'

set -s escape-time 0

set -g  default-terminal "$TERM"
set -ga terminal-overrides ",$TERM:Tc"

set -g mouse on
